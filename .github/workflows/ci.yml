name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.24"
          python-version: "3.12"
      - name: Install native CLI dependency
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - name: Help without credentials
        run: |
          uv run codex-call-api --help
          uv run codex-call-worker --help
          uv run codex-call-worker start --help
          uv run codex-call-mcp --help
